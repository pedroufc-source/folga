<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FOLGA: imagem de compartilhamento do link</title>
<!-- Gera og.png (1200×630) com `npm run images`. Usa os tokens, a fonte e os botões do jogo. -->
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr 520px; gap: 48px; align-items: center; padding: 0 64px; background: var(--paper); }
  .brand { font-size: 40px; border-width: 5px; padding: 2px 14px 0; display: inline-block; }
  .eyebrow { margin: 30px 0 12px; font-size: 18px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 84px; line-height: .98; text-transform: uppercase; }
  .ask { margin: 18px 0 0; font-size: 40px; }
  .choices { gap: 18px; }
  .choice { min-height: 300px; padding: 26px 22px; }
  .choice-name { font-size: 76px; }
  .choice .strip { gap: 5px; }
  .choice .strip i { height: 36px; border-radius: 5px; }
  .strip svg { max-width: 28px; }
  .choice-sub { font-size: 21px; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="star" viewBox="0 0 24 24"><path d="M12 1.8l3 7.1 7.7.6-5.9 5 1.8 7.5L12 18l-6.6 4 1.8-7.5-5.9-5 7.7-.6z"/></symbol>
    <symbol id="arminha" viewBox="0 0 24 24"><path d="M8.2 2.6c.9 0 1.6.7 1.6 1.6V8.6h10.4c1 0 1.8.8 1.8 1.8s-.8 1.8-1.8 1.8h-5.4v.6c.8.2 1.3.9 1.3 1.7s-.5 1.4-1.2 1.6c.5.3.8.9.8 1.5 0 1-.8 1.8-1.8 1.8H7.6c-2.4 0-4.2-1.9-4.2-4.2v-3.9c0-1.3.9-2.4 2.1-2.7V4.2c0-.9.7-1.6 1.6-1.6z"/><rect x="0.6" y="10.2" width="2.2" height="8.4" rx=".6"/></symbol>
  </svg>
  <div>
    <span class="brand">FOLGA</span>
    <p class="eyebrow">Segundo turno · 25 de outubro</p>
    <h1>Sua vida cabe na 6×1?</h1>
    <p class="ask">3 minutos pra encaixar a semana.</p>
  </div>
  <div class="choices">
    <div class="choice choice-0"><span class="choice-name">6×1</span><span class="strip"><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"><svg><use href="#arminha"/></svg></i></span><span class="choice-sub">com Flávio · 44h</span></div>
    <div class="choice choice-1"><span class="choice-name"><svg class="choice-star"><use href="#star"/></svg>5×2</span><span class="strip"><i></i><i></i><i></i><i></i><i></i><i class="off"><svg><use href="#star"/></svg></i><i class="off"><svg><use href="#star"/></svg></i></span><span class="choice-sub">vida além do trabalho</span></div>
  </div>
</body>
</html>
