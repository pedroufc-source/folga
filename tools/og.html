<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FOLGA: imagem de compartilhamento do link</title>
<!-- Gera og.png (1200×630) com `npm run images`. Usa os tokens, a fonte e os botões do jogo. -->
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr 520px; gap: 48px; align-items: center; padding: 0 64px; background: var(--paper); }
  .brand { font-size: 40px; border-width: 5px; padding: 2px 14px 0; display: inline-block; }
  .eyebrow { margin: 30px 0 12px; font-size: 18px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 84px; line-height: .98; text-transform: uppercase; }
  .ask { margin: 18px 0 0; font-size: 40px; }
  .choices { gap: 18px; }
  .choice { min-height: 300px; padding: 26px 22px; }
  .choice-name { font-size: 76px; }
  .choice .strip { gap: 5px; }
  .choice .strip i { height: 36px; border-radius: 5px; }
  .strip svg { max-width: 28px; }
  .choice-sub { font-size: 21px; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="star" viewBox="0 0 24 24"><path d="M12 1.8l3 7.1 7.7.6-5.9 5 1.8 7.5L12 18l-6.6 4 1.8-7.5-5.9-5 7.7-.6z"/></symbol>
    <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6"/><path d="M12 1.5v3.2M12 19.3v3.2M1.5 12h3.2M19.3 12h3.2M4.6 4.6l2.3 2.3M17.1 17.1l2.3 2.3M4.6 19.4l2.3-2.3M17.1 6.9l2.3-2.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  </svg>
  <div>
    <span class="brand">FOLGA</span>
    <p class="eyebrow">Segundo turno · 25 de outubro</p>
    <h1>Você trabalha na escala 6×1.</h1>
    <p class="ask">Qual é o seu candidato?</p>
  </div>
  <div class="choices">
    <div class="choice choice-0"><span class="choice-name">Flávio</span><span class="strip"><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"><svg><use href="#sun"/></svg></i></span><span class="choice-sub">semana 6×1 · 44h</span></div>
    <div class="choice choice-1"><span class="choice-name"><svg class="choice-star"><use href="#star"/></svg>Lula</span><span class="strip"><i></i><i></i><i></i><i></i><i></i><i class="off"><svg><use href="#star"/></svg></i><i class="off"><svg><use href="#star"/></svg></i></span><span class="choice-sub">semana 5×2 · 40h</span></div>
  </div>
</body>
</html>
